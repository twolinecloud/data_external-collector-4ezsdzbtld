swagger-ui:
  protocol: "http"
  host: "localhost:8000"

logging:
  config: classpath:log4j2-spring.yml

# 로컬에서는 클러스터 내부 주소로 나갈 수 없으므로 관리자 서비스 폴링을 끈다. 켜려면 ADMIN_API_URL 지정
# (예: kubectl port-forward 한 주소).
admin-api:
  base-url: ${ADMIN_API_URL:}

public-data:
  cleanse:
    json-drop:
      # 로컬 개발에서는 기본으로 켜둠 - 정제 결과를 바로 파일로 확인할 수 있게 (scripts/force-collect-cleanse.sh 참고)
      enabled: true

