spring:
  application:
    name: external-collector-4ezsdzbtld
    version: v1
    desc: external-collector-4ezsdzbtld RESTful API Service
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
  # admin-db(kcais, PostgreSQL) - public-data.load.enabled=true일 때만 AdminDbConfig가 이 값으로
  # 실제 DataSource를 만든다(꺼져있으면 이 블록 자체가 안 읽힘, DataSourceAutoConfiguration도
  # Main.java에서 제외돼있어 값이 비어있어도 앱 기동에 영향 없음). 로컬 개발 시엔
  # `kubectl port-forward svc/admin-db-fy9tjq4tsk -n service-core 15432:5432`로 접속 -
  # private-doc/cleanse-db-schema-spec.md §6 참고.
  datasource:
    url: jdbc:postgresql://${ADMIN_DB_HOST:127.0.0.1}:${ADMIN_DB_PORT:15432}/${ADMIN_DB_NAME:correction_ai}?currentSchema=kcais
    username: ${ADMIN_DB_USER:}
    password: ${ADMIN_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    # Hikari 기본값(풀 크기 10, 기동시 즉시 전부 예열)은 우리 워크로드엔 과함 - raw_staging을
    # 한 줄씩 순차 처리하는 구조라 동시 커넥션이 여러 개 필요 없음. 2026-08-21: 이 기본값 때문에
    # 로컬 개발 중 반복 재기동으로 admin-db 커넥션 슬롯을 다 소진해 다른 서비스 접속까지 막은 적
    # 있음 - 풀을 작게 잡고, 오래 열려있는데 안 쓰는 연결은 최대수명을 짧게 둬서 자동 회수되게 함.
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000        # 30초 이상 노는 연결은 자동 반납(풀 크기가 minimum-idle까지 줄어듦)
      max-lifetime: 600000       # 10분 넘은 연결은 강제 재생성 - 방치돼도 오래 안 남음
      leak-detection-threshold: 30000  # 30초 넘게 반납 안 된 커넥션은 경고 로그(실제 코드 누수 감지용)
      # 스켈레톤 컨벤션 변경(2026-08-27, UTC -> Asia/Seoul)에 맞춰 DB 세션 타임존도 통일 -
      # 커넥션 풀에서 새로 여는 연결마다 세션 타임존을 KST로 고정한다.
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'

server:
  port: 8080
  forward-headers-strategy: framework

service-path: ${SERVICE_PATH:}

springdoc:
  cache:
    disabled: true
  version: 1
  api-docs:
    path: /v3/api-docs
    enabled: true
    resolve-schema-properties: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    path: /swagger-ui.html
    url: ${SERVICE_PATH:}/v3/api-docs
    config-url: ${SERVICE_PATH:}/v3/api-docs/swagger-config
    disable-swagger-default-url: true
    display-query-params-without-oauth2: true
    show-common-extensions: true
  show-actuator: true
  show-login-endpoint: true

logging:
  config: classpath:log4j2-spring.yml
  level:
    org.springframework.web.servlet.PageNotFound: 'OFF'


management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      # 쿠버네티스 livenessProbe/readinessProbe가 각각 /actuator/health/liveness,
      # /actuator/health/readiness를 보게 하는 스프링 부트 내장 기능 - 클러스터 환경이면
      # 기본 활성화되지만 로컬 등에서도 동작 확인 가능하게 명시 (2026-08-26).
      probes:
        enabled: true
      group:
        liveness:
          # 기본 livenessState에 스케줄러 하트비트(SchedulerHeartbeatHealthIndicator)를
          # 추가 - 웹서버는 떠있는데 @Scheduled 스레드풀만 조용히 멈추는 상황(2026-08-25
          # 실측, 9시간 무감지 정지)을 이 프로브가 직접 잡아서 파드 재시작을 유도한다.
          include: livenessState, schedulerHeartbeat

# 공공데이터 수집 파이프라인 (data-collector 저장소에서 이관됨, private-doc 19번 항목 참고)
# 소스(오퍼레이션)별 스케줄은 개별 cron으로 관리 (기본값은 PublicDataCollectorScheduler 코드에도 있음, 여기서 오버라이드 가능)
# 엔드포인트는 weather-api.docx / data.go.kr 공개 스펙 기준 실제 값. serviceKey는 .env로 로컬 주입
public-data:
  collector:
    kma-village-forecast-ultra-srt-ncst:
      cron: "0 12 * * * *"
    kma-village-forecast-ultra-srt-fcst:
      cron: "0 47 * * * *"
    kma-village-forecast-vilage-fcst:
      cron: "0 15 2,5,8,11,14,17,20,23 * * *"
    kma-weather-warning-list:
      cron: "0 */10 * * * *"
    moleg-criminal-law:
      cron: "0 0 5 * * *"
    safetydata-disaster-msg-list:
      cron: "0 */10 * * * *"
    kma-living-uv-idx:
      cron: "0 10 0,3,6,9,12,15,18,21 * * *"
    kma-living-air-diffusion-idx:
      cron: "0 10 0,3,6,9,12,15,18,21 * * *"
    # 매시 25분 - 직전 정시 자료를 받는다. 실측(2026-09-03 13:50)에선 당시 정시 자료가 이미
    # 올라와 있었지만, 정시 직후에 돌면 아직 없을 수 있어 여유를 뒀다(KmaAsosHourlyCollector 참고).
    kma-asos-hourly:
      cron: "0 25 * * * *"
    # 매시 20분 - 실측(14:15)에 이미 14:00 자료가 있었다. ASOS(25분)와 5분 떨어뜨린 이유는
    # PublicDataCollectorScheduler#collectAirKoreaRealtime 주석 참고.
    airkorea-realtime-measure:
      cron: "0 20 * * * *"
  cleanse:
    # 수집 스케줄보다 자주 돌려서 raw_staging COLLECTED 적체가 오래 쌓이지 않게 함
    cron: "0 */5 * * * *"
    json-drop:
      # 정제 결과를 로컬 파일로 즉시 내려받는 디버그/뷰어 전용 부가 기능 (CleansedJsonDropWriter).
      # 기본 꺼짐 - admin-db 적재 전까지 정제 결과를 눈으로 확인할 방법이 없어서 추가함, 운영에는 영향 없음.
      enabled: ${PUBLIC_DATA_CLEANSE_JSON_DROP_ENABLED:false}
      dir: ${PUBLIC_DATA_CLEANSE_JSON_DROP_DIR:private-doc/cleansed-json-drop}
  load:
    # admin-db(kcais) 적재 - 2026-08-21 신규. 기본 꺼짐(로그 컬렉터와 동일 원칙) - 켜면
    # AdminDbConfig가 DataSource/MyBatis 빈을 실제로 만들고, 스케줄러/수동 트리거가 CLEANSED
    # 상태 raw_staging 행을 admin-db 최종 테이블에 upsert하기 시작한다. 켜기 전에
    # FacilityMasterSeeder로 tb_ext_weather_facility(마스터)부터 채워야 FK가 성립한다.
    enabled: ${PUBLIC_DATA_LOAD_ENABLED:false}
    cron: "0 */5 * * * *"
    # 적재 실패(LOAD_FAILED) 행 재시도 한도 - 2026-08-31 신규.
    # 매 주기 LOAD_FAILED를 먼저 재시도하고, 이 횟수까지 실패하면 LOAD_ABANDONED로 종결해
    # 더는 재시도하지 않는다(계속 실패하는 행이 매 주기 재시도 배치를 독점하는 것 방지).
    # 포기 건수는 public_data_load_abandoned_total 메트릭으로 나감 - 이 값이 오르면
    # 해당 수집분이 영구 유실됐다는 뜻이라 알람 대상.
    max-attempts: ${PUBLIC_DATA_LOAD_MAX_ATTEMPTS:3}
  purge:
    # admin-db 보존기간 초과 데이터 자동 폐기 - 2026-08-24 신규, task-spec.md 11번 항목
    # ("비식별화(저장)/전송 데이터는 실행일시로부터 1개월만 노출, 이후 폐기") 요구사항 구현.
    # 기본 꺼짐(Load와 동일 원칙) - 켜면 AdminDbConfig가 활성화되고 매일 새벽 3시에
    # reg_dtm(적재 시각) 기준 retention-days 초과 행을 최종 테이블 5개(ncst/ultra_fcst/
    # vilage_fcst/warning/disaster_msg)에서 삭제한다. law_target/weather_facility(마스터
    # 테이블)는 폐기 대상 아님. 수동 트리거는 POST /public-data/purge/run.
    enabled: ${PUBLIC_DATA_PURGE_ENABLED:false}
    retention-days: ${PUBLIC_DATA_PURGE_RETENTION_DAYS:30}
    cron: "0 0 3 * * *"
  facility-sync:
    # 교정기관 목록 자동 동기화(Phase A, 2026-08-24 신규) - 대시보드 팀이 관리하는
    # tb_dim_instt(기관 마스터)와 우리 tb_ext_weather_facility를 매일 새벽 4시에 대조해서
    # 변경분(신규/제외검토)을 tb_ext_facility_review_queue에 쌓는다. 아직 CSV를 자동으로
    # 고치진 않음 - 신규 시설은 좌표 자동 지오코딩(Phase B, 미구현)이 붙기 전까지 사람이
    # 큐를 보고 직접 kma-facility-locations.csv에 추가해야 한다. 기본 꺼짐(Load와 동일 원칙).
    # 수동 트리거는 POST /public-data/facility-sync/run, 조회는 GET .../queue.
    enabled: ${PUBLIC_DATA_FACILITY_SYNC_ENABLED:false}
    cron: "0 0 4 * * *"
  vworld:
    # 국토교통부 공간정보오픈플랫폼 - 신규 시설 주소 자동 지오코딩(Phase B, 2026-08-24)에
    # 사용. tb_dim_instt.dtladr 주소 상당수가 번지수 마스킹(000/0000)돼있어 실패율이 높을
    # 것을 전제로 함(FacilitySyncService/VWorldGeocoder 클래스 주석 참고) - 실패해도
    # 파이프라인은 안 죽고 검토 큐에 상태만 남는다.
    endpoint: ${VWORLD_ENDPOINT:http://api.vworld.kr/req/address}
    api-key: ${VWORLD_API_KEY:}
  facility:
    # 컬렉터가 실제로 쓰는 교정기관 기준정보 출처 - csv(기본값, 지금까지와 동일) | db
    # (Phase C, 2026-08-24 - tb_ext_weather_facility에서 매 스케줄 틱마다 새로 조회, Phase B의
    # approve()로 승인된 신규 시설이 재시작 없이 다음 틱부터 실제 수집에 반영됨). db일 때만
    # AdminDbConfig가 활성화됨(public-data.load.enabled와는 별개). db 조회 실패 시 그 틱만
    # 빈 목록으로 건너뜀, 앱은 안 죽음(DbFacilityMasterSource).
    master-source: ${PUBLIC_DATA_FACILITY_MASTER_SOURCE:csv}
  kma:
    village-forecast:
      endpoint: ${KMA_VILLAGE_FORECAST_ENDPOINT:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
      service-key: ${KMA_VILLAGE_FORECAST_SERVICE_KEY:}
    weather-warning:
      endpoint: ${KMA_WEATHER_WARNING_ENDPOINT:https://apis.data.go.kr/1360000/WthrWrnInfoService}
      service-key: ${KMA_WEATHER_WARNING_SERVICE_KEY:}
      # 위치의존 오퍼레이션의 지역 목록은 classpath:kma-facility-locations.csv (전국 교정기관 59개소,
      # private-doc 24/25번 항목 참고) - FacilityLocationLoader가 읽어서 KmaLocationCollectorFactory가
      # 오퍼레이션×지역 조합으로 컬렉터를 생성한다. 지역 추가/변경은 그 CSV만 고치면 됨.
    living-wthr-idx:
      # 생활기상지수(자외선지수/대기정체지수) - 2026-08-24 신규, 교정시설 야외활동 참고용
      # (task 요청). areaNo(시도 코드) 목록은 classpath:kma-living-wthr-idx-area.csv(17개
      # 시도) - LivingWthrIdxAreaLoader가 읽어서 LivingWthrIdxCollectorFactory가 시도 수만큼
      # 컬렉터를 생성한다. areaNo/time 파라미터 형식은 실제 서비스키로 실측 확인 완료
      # (2026-08-24, cleanse-db-schema-spec.md §2.8 참고) - 시군구가 아니라 시도 단위 생산.
      endpoint: ${LIVING_WTHR_IDX_ENDPOINT:https://apis.data.go.kr/1360000/LivingWthrIdxServiceV5}
      service-key: ${LIVING_WTHR_IDX_SERVICE_KEY:}
    asos-hourly:
      # 지상 종관기상관측(ASOS) 시간자료 - 2026-09-03 신규. 날씨 기호 요구사항의 안개/박무/연무용.
      #
      # 다른 기상청 수집기와 달리 data.go.kr이 아니라 API 허브(apihub.kma.go.kr)를 쓴다 -
      # data.go.kr 쪽은 stnIds가 필수라 지점을 하나씩 불러야 해서(stnIds=0은 NO_DATA, 생략하면
      # 필수파라미터 오류 - 실측 확인) 전국이면 시간당 97회가 된다. API 허브는 stn=0 한 번으로
      # 전 지점을 준다. 인증 파라미터 이름도 serviceKey가 아니라 authKey라 키를 따로 둔다.
      # 자세한 근거는 KmaApiHubClient 주석 참고.
      #
      # 주의 - 안개/박무/연무를 "관측된 현상코드"로 읽을 수 없다. 일기 항목(WW/WC/WP)은 일기
      # 포함여부(IX)가 1인 지점만 채워지는데, 실측 결과 전국 97개 지점 중 9개뿐이었다
      # (9/1 06시·07시 동일). 교정기관 59개소를 그걸로 덮을 수 없어서, 거의 전 지점에 들어오는
      # 시정(VS, 96/97)과 습도(HM, 97/97)로 유도한다. 판정 기준값은 기획 확정 대기 중 -
      # 통상 안개<1km, 박무 1~10km+고습도, 연무 1~10km+저습도.
      endpoint: ${KMA_ASOS_HOURLY_ENDPOINT:https://apihub.kma.go.kr/api/typ01/url/kma_sfctm2.php}
      auth-key: ${KMA_APIHUB_AUTH_KEY:}
    forecast-bulletin:
      # 동네예보 통보문 - 가끔/한때, "눈 또는 비"의 순서 구분용(격자예보 코드로는 표현 불가).
      # 3순위라 아직 실호출 미검증 - 문장 형식과 표현 어휘는 받아봐야 확정된다.
      endpoint: ${KMA_FORECAST_BULLETIN_ENDPOINT:https://apis.data.go.kr/1360000/VilageFcstMsgService}
      service-key: ${KMA_FORECAST_BULLETIN_SERVICE_KEY:}
  # 법제처(국가법령정보센터) 형사법령정보 - private-doc 31번 항목 참고. LawSourcePort(포트)의
  # 현재 활성 구현은 DirectLawSourceAdapter(직접연결) - 이 연결 자체가 ESB로 이동 예정이라
  # 나중에 스펙이 나오면 이 설정 블록도 ESB 쪽으로 옮겨가고 어댑터만 교체하면 됨.
  moleg:
    endpoint: ${MOLEG_ENDPOINT:https://www.law.go.kr/DRF/lawService.do}
    # OC(이용자ID)는 법제처에서 별도 발급받는 값 - 로컬 .env에만 있고 git엔 안 올라감
    oc: ${MOLEG_OC:}
    # 형사법령 목록은 classpath:moleg-criminal-laws.csv (모법 22개 + 시행령/시행규칙 22개,
    # 총 44건) - MolegLawListLoader가 읽어서 MolegLawCollectorFactory가 법령별 컬렉터를
    # 생성한다. 목록 추가/변경은 그 CSV만 고치면 됨.
    # 법령 "수집 대상 목록"의 출처 - csv(기본값, 지금까지와 동일) | db(admin-db
    # tb_ext_law_target에서 매 수집 틱마다 새로 조회, 관리자 콘솔 편집 반영용, 2026-08-21).
    # db일 때만 AdminDbConfig가 활성화됨(public-data.load.enabled와는 별개 - Load를 안 켜도
    # 이것만 db로 쓸 수 있음). db 조회 실패 시 그날 수집만 0건으로 건너뜀, 앱은 안 죽음.
    law-target-source: ${PUBLIC_DATA_MOLEG_LAW_TARGET_SOURCE:csv}
  # 재난안전데이터공유플랫폼(행정안전부_긴급재난문자, DSSP-IF-00247) - 2026-08-14 신규.
  # 서비스키 승인 대기 중이라 아직 라이브 미검증 - 응답 필드는 사용자가 제공한 공식 샘플
  # (private-doc/safetydata.csv)로 확정했지만, 요청 파라미터/응답 envelope은 추정값임
  # (DisasterMsgCollector 클래스 주석 참고). 승인되면 가장 먼저 재검증할 것.
  safetydata:
    endpoint: ${SAFETYDATA_ENDPOINT:https://www.safetydata.go.kr/V2/api/DSSP-IF-00247}
    service-key: ${SAFETYDATA_SERVICE_KEY:}
  # 한국환경공단 에어코리아 대기오염정보 - 2026-09-03 신규. 날씨 기호 요구사항의 황사용.
  # 기상청이 아닌 환경공단 소관이라 kma 블록 밖에 둔다(발급처는 같은 data.go.kr이라 키는 동일).
  #
  # 주의 1 - 여기서 얻는 값은 엄밀히 황사가 아니라 미세먼지(PM10)다. 황사 전용 코드가 없어서,
  # 황사 신호로는 이미 수집 중인 기상특보(황사주의보/경보)가 더 직접적이다. PM10은 보조 지표.
  # 주의 2 - 응답 봉투가 기상청과 다르다. body.items가 배열 자체이고(기상청은 items.item),
  # 실패 시엔 OpenAPI_ServiceResponse.cmmMsgHeader로 온다. KmaResponseParser 재사용 불가.
  # 주의 3 - 서버가 불안정하다. 실호출 검증 중 3회 중 2회 SERVICETIMEOUT_ERROR가 났고 재시도로
  # 성공했다. 수집기에 재시도가 사실상 필수. 정상 응답 안에도 "통신장애"(값 "-") 결측이 섞인다.
  airkorea:
    endpoint: ${AIRKOREA_ENDPOINT:https://apis.data.go.kr/B552584/ArpltnInforInqireSvc}
    service-key: ${AIRKOREA_SERVICE_KEY:}

# 로그 컬렉터(Log Collector) 연동 - kcais-admin 플랫폼의 tb_batch_exec_log/tb_batch_step_log/
# tb_ext_collect_log(T1/T2/T6)에 배치 실행 이력을 남기는 별도 REST API 마이크로서비스.
# private-doc/log-collector-api-spec.md 참고. 기본값 enabled=false - 아직 PL과 최종
# "편입 여부"를 확정하지 않았고, 켜면 공유 플랫폼 테이블에 실제 데이터가 남으므로 명시적으로
# 켜기 전까지는(LOG_COLLECTOR_ENABLED=true) 전 구간이 조용히 no-op 상태를 유지한다.
log-collector:
  enabled: ${LOG_COLLECTOR_ENABLED:false}
  base-url: ${LOG_COLLECTOR_BASE_URL:https://kcais-admin.twolinecloud.com/logc}
