spring:
  application:
    name: external-collector-4ezsdzbtld
    version: v1
    desc: external-collector-4ezsdzbtld RESTful API Service
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss"

server:
  port: 8080
  forward-headers-strategy: framework

service-path: ${SERVICE_PATH:}

springdoc:
  cache:
    disabled: true
  version: 1
  api-docs:
    path: /v3/api-docs
    enabled: true
    resolve-schema-properties: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    path: /swagger-ui.html
    url: ${SERVICE_PATH:}/v3/api-docs
    config-url: ${SERVICE_PATH:}/v3/api-docs/swagger-config
    disable-swagger-default-url: true
    display-query-params-without-oauth2: true
    show-common-extensions: true
  show-actuator: true
  show-login-endpoint: true

logging:
  config: classpath:log4j2-spring.yml
  level:
    org.springframework.web.servlet.PageNotFound: 'OFF'


management:
  endpoints:
    web:
      exposure:
        include: '*'

# 공공데이터 수집 파이프라인 (data-collector 저장소에서 이관됨, private-doc 19번 항목 참고)
# 소스(오퍼레이션)별 스케줄은 개별 cron으로 관리 (기본값은 PublicDataCollectorScheduler 코드에도 있음, 여기서 오버라이드 가능)
# 엔드포인트는 weather-api.docx / data.go.kr 공개 스펙 기준 실제 값. serviceKey는 .env로 로컬 주입
public-data:
  collector:
    kma-village-forecast-ultra-srt-ncst:
      cron: "0 12 * * * *"
    kma-village-forecast-ultra-srt-fcst:
      cron: "0 47 * * * *"
    kma-village-forecast-vilage-fcst:
      cron: "0 15 2,5,8,11,14,17,20,23 * * *"
    kma-weather-warning-list:
      cron: "0 */10 * * * *"
    moleg-criminal-law:
      cron: "0 0 5 * * *"
  cleanse:
    # 수집 스케줄보다 자주 돌려서 raw_staging COLLECTED 적체가 오래 쌓이지 않게 함
    cron: "0 */5 * * * *"
  kma:
    village-forecast:
      endpoint: ${KMA_VILLAGE_FORECAST_ENDPOINT:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
      service-key: ${KMA_VILLAGE_FORECAST_SERVICE_KEY:}
    weather-warning:
      endpoint: ${KMA_WEATHER_WARNING_ENDPOINT:https://apis.data.go.kr/1360000/WthrWrnInfoService}
      service-key: ${KMA_WEATHER_WARNING_SERVICE_KEY:}
      # 위치의존 오퍼레이션의 지역 목록은 classpath:kma-facility-locations.csv (전국 교정기관 59개소,
      # private-doc 24/25번 항목 참고) - FacilityLocationLoader가 읽어서 KmaLocationCollectorFactory가
      # 오퍼레이션×지역 조합으로 컬렉터를 생성한다. 지역 추가/변경은 그 CSV만 고치면 됨.
  # 법제처(국가법령정보센터) 형사법령정보 - private-doc 31번 항목 참고. LawSourcePort(포트)의
  # 현재 활성 구현은 DirectLawSourceAdapter(직접연결) - 이 연결 자체가 ESB로 이동 예정이라
  # 나중에 스펙이 나오면 이 설정 블록도 ESB 쪽으로 옮겨가고 어댑터만 교체하면 됨.
  moleg:
    endpoint: ${MOLEG_ENDPOINT:https://www.law.go.kr/DRF/lawService.do}
    # OC(이용자ID)는 법제처에서 별도 발급받는 값 - 로컬 .env에만 있고 git엔 안 올라감
    oc: ${MOLEG_OC:}
    # 형사법령 목록은 classpath:moleg-criminal-laws.csv (모법 22개 + 시행령/시행규칙 22개,
    # 총 44건) - MolegLawListLoader가 읽어서 MolegLawCollectorFactory가 법령별 컬렉터를
    # 생성한다. 목록 추가/변경은 그 CSV만 고치면 됨.
